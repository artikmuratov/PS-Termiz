<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{DARS_RAQAMI}}-dars: {{MAVZU_NOMI}}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #a78bfa;
      --code-bg: #020617;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .deck { flex: 1; position: relative; }
    .slide {
      position: absolute;
      inset: 0;
      padding: 48px 64px;
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }
    .slide.active { display: flex; }
    .badge {
      display: inline-block;
      width: fit-content;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
    }
    h1 { font-size: 48px; line-height: 1.15; }
    h2 { font-size: 36px; color: var(--accent); }
    p, li { font-size: 24px; line-height: 1.5; color: #e2e8f0; }
    ul { padding-left: 28px; display: flex; flex-direction: column; gap: 12px; }
    pre {
      background: var(--code-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      font-size: 20px;
      line-height: 1.5;
      overflow-x: auto;
      color: #7dd3fc;
    }
    .tip {
      background: var(--card);
      border-left: 4px solid var(--accent2);
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 22px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      background: #020617;
      border-top: 1px solid #1e293b;
      font-size: 15px;
      color: var(--muted);
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="deck" id="deck">
    <section class="slide active">
      <span class="badge">{{MODUL_NOMI}} • {{DARS_RAQAMI}}-dars</span>
      <h1>{{MAVZU_NOMI}}</h1>
      <p>{{QISQA_TAVSIF}}</p>
    </section>
    <!-- Qolgan slaydlar shu yerga qo'shiladi -->
  </div>
  <div class="controls">
    <span id="counter">1 / 1</span>
    <div>
      <button onclick="prev()">← Oldingi</button>
      <button onclick="next()">Keyingi →</button>
    </div>
  </div>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    let idx = 0;
    function show(n) {
      slides[idx].classList.remove('active');
      idx = (n + slides.length) % slides.length;
      slides[idx].classList.add('active');
      document.getElementById('counter').textContent = `${idx + 1} / ${slides.length}`;
    }
    const next = () => show(idx + 1);
    const prev = () => show(idx - 1);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') next();
      if (e.key === 'ArrowLeft') prev();
    });
    show(0);
  </script>
</body>
</html>
